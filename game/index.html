/* Layout: a field-office console. Tool rail | basin map | season plan panel, with six target gauges along the bottom. */
:root {
  --bg: #E7ECE3;          /* dry-season paddy grey-green */
  --surface: #F5F7F1;
  --surface-2: #DCE4D6;
  --fg: #15211A;
  --muted: #56685C;
  --line: #C2CEBD;
  --accent: #D29A17;      /* palay gold */
  --accent-ink: #1E1503;
  --water: #2A78A0;
  --good: #23784A;
  --warn: #A86A12;
  --bad: #B03A2B;
  --bau: #8A968D;
  --shadow: 0 1px 0 rgba(21,33,26,.04), 0 8px 24px -12px rgba(21,33,26,.25);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --surface: #151F1A; --surface-2: #1E2A24; --fg: #E3EBE3; --muted: #93A698; --line: #2B3A32;
    --accent: #E3B13E; --accent-ink: #1E1503; --water: #5CB2DA; --good: #5EC08A; --warn: #E2A94E; --bad: #EC7563; --bau: #77857B;
    --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --surface: #151F1A; --surface-2: #1E2A24; --fg: #E3EBE3; --muted: #93A698; --line: #2B3A32;
  --accent: #E3B13E; --accent-ink: #1E1503; --water: #5CB2DA; --good: #5EC08A; --warn: #E2A94E; --bad: #EC7563; --bau: #77857B;
  --shadow: 0 1px 0 rgba(0,0,0,.2), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-display); font-weight: 600; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

.app { display: flex; flex-direction: column; gap: 12px; min-height: 100%; padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1640px; margin: 0 auto; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: .01em; margin: 0; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand { flex-wrap: wrap; }
.home-link { flex-basis: 100%; font-size: 12.5px; font-weight: 600; color: var(--muted); text-decoration: none; margin-bottom: 2px; }
.home-link:hover { color: var(--fg); text-decoration: underline; }
.brand .tag { color: var(--muted); font-size: 13px; }
.hstat { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hstat b { font-family: var(--font-display); font-weight: 600; font-size: 19px; line-height: 1.15; }
.hstat .sub { font-size: 12.5px; color: var(--muted); }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--fg); white-space: nowrap; }
.pill.nino { background: color-mix(in srgb, var(--warn) 22%, transparent); }
.pill.nina { background: color-mix(in srgb, var(--water) 22%, transparent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; padding: 7px 18px; }
.btn.primary:hover { filter: brightness(1.05); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }

/* main grid */
.main { display: grid; grid-template-columns: 76px minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
.rail { display: flex; flex-direction: column; gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px); }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 7px; border-radius: var(--r); border: 1px solid transparent; background: transparent; cursor: pointer; font-size: 11.5px; line-height: 1.15; text-align: center; color: var(--fg); }
.tool svg { width: 26px; height: 26px; }
.tool .cost { font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.tool:hover { background: var(--surface); border-color: var(--line); }
.tool[aria-pressed="true"] { background: var(--surface); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; width: auto; }

.mapcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.overlays { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.overlays .eyebrow { margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.mapwrap { position: relative; border-radius: var(--r); overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); touch-action: none; }
#map { display: block; max-width: 100%; height: auto; margin: 0 auto; cursor: crosshair; }
.tip { position: absolute; pointer-events: none; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px; font-size: 12.5px; line-height: 1.35; max-width: 250px; box-shadow: var(--shadow); z-index: 3; }
.tip b { font-weight: 600; }
.tip .k { color: var(--muted); }
.mapcap { position: absolute; left: 10px; top: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); padding: 6px 10px; border-radius: var(--r); font-size: 13px; z-index: 2; max-width: calc(100% - 20px); }
.mapcap b { font-family: var(--font-display); font-size: 16px; letter-spacing: .02em; text-transform: uppercase; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); align-items: center; min-height: 22px; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,.15); }
.legend .ramp { display: inline-block; width: 120px; height: 10px; border-radius: 2px; vertical-align: -1px; margin: 0 6px; }

/* side panel */
.panel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 110px); position: sticky; top: env(safe-area-inset-top, 0px); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1 1 auto; background: none; border: 0; padding: 10px 3px 9px; cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 13.5px; letter-spacing: .04em !important; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabbody { padding: 14px 16px 18px; overflow-y: auto; min-height: 0; }
.tabbody h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.tabbody h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; margin: 18px 0 6px; color: var(--muted); }
.tabbody p { margin: 6px 0; }
.meta { color: var(--muted); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
.field > .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; }
.field > .lbl i { font-style: normal; font-weight: 400; color: var(--muted); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 6px 4px; font-size: 13px; cursor: pointer; line-height: 1.2; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
.seg button[disabled] { color: var(--muted); cursor: not-allowed; background: var(--surface-2); }
.hint { font-size: 12.5px; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: 13.5px; align-items: baseline; }
.kv .h { font-family: var(--font-display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; }
.kv .h:first-child { text-align: left; }
.kv .v { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; }
.kv .b { color: var(--muted); }
.parcel-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.ps { background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; }
.ps .v { font-family: var(--font-data); font-size: 17px; font-variant-numeric: tabular-nums; }
.ps .l { font-size: 11.5px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); font-size: 14px; }
.science p, .science li { font-size: 13.5px; }
.science ul { padding-left: 18px; margin: 6px 0; }
.science code { font-family: var(--font-data); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.science table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.science td, .science th { border-bottom: 1px solid var(--line); padding: 4px 4px; text-align: left; vertical-align: top; }
.science .tw { overflow-x: auto; }

/* target cards */
.cards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--surface); border-radius: var(--r); padding: 10px 12px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; border-top: 3px solid var(--line); }
.card.ok { border-top-color: var(--good); }
.card.off { border-top-color: var(--bad); }
.card .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.card .t { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .st { font-size: 11px; font-weight: 600; white-space: nowrap; }
.card.ok .st { color: var(--good); }
.card.off .st { color: var(--bad); }
.card .big { font-family: var(--font-data); font-size: 21px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.card .big small { font-size: 12px; color: var(--muted); font-family: var(--font-body); }
.card .cmp { font-size: 12px; color: var(--muted); }
.card .cmp b { font-weight: 600; }
.card .cmp .g { color: var(--good); } .card .cmp .r { color: var(--bad); }
.card svg { width: 100%; height: 30px; margin-top: 2px; }
.card .rule { font-size: 11.5px; color: var(--muted); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(8,14,11,.55); display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; z-index: 20; }
.sheet { background: var(--surface); color: var(--fg); border-radius: 10px; width: min(780px, 100%); padding: 22px 24px 20px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
.sheet h2 { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1; margin: 2px 0 8px; text-transform: uppercase; text-wrap: balance; }
.sheet h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.sheet p { margin: 6px 0; max-width: 68ch; }
.sheet ul { margin: 6px 0; padding-left: 20px; }
.sheet li { margin: 3px 0; }
.rtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.rtable th { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.rtable th:first-child, .rtable td:first-child { text-align: left; }
.rtable td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.rtable td:first-child { font-family: var(--font-body); }
.rtable .g { color: var(--good); } .rtable .r { color: var(--bad); }
.tw { overflow-x: auto; }
.scen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.scen label { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.scen label b { color: var(--fg); font-family: var(--font-display); font-size: 17px; letter-spacing: .02em; text-transform: uppercase; }
.scen input { position: absolute; opacity: 0; pointer-events: none; }
.scen label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.scen label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.seedrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.seedrow input { font-family: var(--font-data); font-size: 14px; width: 110px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--fg); }
.sheet .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.stars { font-size: 30px; letter-spacing: 4px; color: var(--accent); line-height: 1; }
.stars .off { color: var(--line); }
.multiples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.multiples figure { margin: 0; }
.multiples figcaption { font-size: 12.5px; font-weight: 600; }
.multiples svg { width: 100%; height: auto; display: block; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: var(--r); font-size: 14px; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.key { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }

@media (max-width: 1240px) {
  .main { grid-template-columns: 70px minmax(0, 1fr) 320px; }
  .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 960px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; position: static; overflow-x: auto; padding-bottom: 2px; }
  .rail hr { border-top: 0; border-left: 1px solid var(--line); margin: 4px 2px; }
  .tool { min-width: 68px; }
  .panel { max-height: none; position: static; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .multiples { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .scen { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .card .t { white-space: normal; }
  .brand h1 { font-size: 26px; }
  .brand .tag { display: none; }
  .sheet { padding: 18px 16px; }
  .sheet h2 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* canals */
.seg button small { font-family: var(--font-data); font-size: 10.5px; opacity: .8; }
.pill.cc { background: color-mix(in srgb, var(--good) 22%, transparent); margin-top: 3px; }
.switch { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; margin-top: 4px; }
.switch input { appearance: none; -webkit-appearance: none; width: 40px; height: 22px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked { background: var(--good); }
.switch input:checked::after { transform: translateX(18px); }

/* class leaderboard */
.lb { width: 100%; border-collapse: collapse; font-size: 13px; }
.lb th { font-family: var(--font-display); font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lb th:nth-child(-n+2), .lb td:nth-child(-n+2) { text-align: left; }
.lb td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; vertical-align: top; }

.lb .stars-s { color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
.lb .g { color: var(--good); } .lb .r { color: var(--bad); }
.form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 8px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; font-weight: 600; }
.form input { font: inherit; font-weight: 400; font-size: 14px; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--fg); min-width: 0; }
.submitbox { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-top: 16px; background: var(--surface-2); }
.submitbox h3 { margin-top: 0 !important; }
.basinpick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.basinpick label { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }

    const ws = gross(k, 'ws'), ds = gross(k, 'ds'); calib.Dg.push({ ws, ds });

  calib.sedRef = sediment(G, bau, 'ws', 'neutral').tot;

}

// ---------- scorecards ----------
function sparkline(pv, bv) {
  const n = Math.max(pv.length, 1), all = pv.concat(bv).filter(v => v != null); if (!all.length) return '<svg viewBox="0 0 120 30"></svg>';
  const mx = Math.max(...all, 1e-9), mn = Math.min(0, ...all);
  const X = k => n === 1 ? 60 : 4 + 112 * k / (SEASONS - 1), Y = v => 26 - 22 * (v - mn) / (mx - mn || 1);
  const pl = arr => arr.map((v, k) => `${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 120 30" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="120" y1="26.5" y2="26.5" stroke="var(--line)" stroke-width="1"/>
  <polyline points="${pl(bv)}" fill="none" stroke="var(--bau)" stroke-width="1.4" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
  <polyline points="${pl(pv)}" fill="none" stroke="var(--fg)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
  ${pv.length ? `<circle cx="${X(pv.length - 1)}" cy="${Y(pv[pv.length - 1])}" r="2.2" fill="var(--fg)"/>` : ''}</svg>`;
}
function metricSeries(key, who) {
  return game.history.map(h => { const r = h[who]; if (key === 'income') return incomeOf(r) / 1e6; if (key === 'flower') return r.sKey === 'ds' ? r.flower : null; return r[key]; }).filter(v => v != null);
}
function renderCards() {
  const tp = totals(game.history, 'p'), tb = totals(game.history, 'b'), hasH = game.history.length > 0;
  const p = game.proj, b = game.projB;
  const now = {
    prod: [fmtQ(p.prod), 't this season', fmtQ(b.prod)], income: [fmtPeso(incomeOf(p)), CREDITS.on ? 'incl. credits' : 'this season', fmtPeso(incomeOf(b))],
    co2e: [fmtQ(p.co2e), 't CO₂e this season', fmtQ(b.co2e)], households: [fmtQ(game.design.households), 'homes in a 1-in-25', fmtQ(game.designB.households)],
    flower: [game.projDS.flower == null ? '–' : pct(game.projDS.flower), `DS rice OK · table ${game.projDS.gwEnd.toFixed(1)} m`, game.projDSB.flower == null ? '–' : pct(game.projDSB.flower)], nRiver: [fmtN(p.nRiver), 't N this season', fmtN(b.nRiver)]
  };
  const projVal = { prod: [p.prod, b.prod], income: [incomeOf(p), incomeOf(b)], co2e: [p.co2e, b.co2e], households: [game.design.households, game.designB.households], flower: [game.projDS.flower ?? 0, game.projDSB.flower ?? 0], nRiver: [p.nRiver, b.nRiver] };

    if (hasH && pv != null) { ok = T.test(pv, bv, tp); so = T.key === 'flower' ? `So far: ${pct(pv)} vs BAU ${pct(bv ?? 0)} · table ${tp.gwEnd.toFixed(1)} m` : `So far: ${T.key === 'income' ? fmtPeso(pv * 1e6) : fmtQ(pv)} vs BAU ${T.key === 'income' ? fmtPeso(bv * 1e6) : fmtQ(bv)}`; }
    else { ok = T.test(projVal[T.key][0], projVal[T.key][1], { gwEnd: game.projDS.gwEnd }); so = hasH && T.key === 'flower' ? 'No dry season played yet' : 'No seasons played yet'; }
    const [big, unit, bau] = now[T.key];

async function runCurrentSeason() {

  const rp = runSeason(G, game.world, s, wx, game.calib, { keepSims: true, keepHydro: true });
  const rb = runSeason(G, game.bau, s, wx, game.calib, { keepSims: true });
  attachCredits(rp, rb); rp.canal = game.world.canal.slice(); rp.creditsOn = CREDITS.on;
  for (let k = 0; k < rp.storms.length; k++) {
    const st = rp.storms[k];
    await animateStorm(st.sim, `<b>${stormName(st.P)}, ${dayToDate(s, st.day)}</b><br>${st.P} mm in ${B.stormH} h · ${rpText(st.P)} · ${st.households ? `${fmtQ(st.households)} homes flooded` : 'towns stay dry'}`);
  }
  $('#mapcap').hidden = true;
  rp.storms.forEach((st, k) => { st.bauHouseholds = rb.storms[k].households; st.bauSub = rb.storms[k].subHa; st.sim = null; }); rb.storms.forEach(st => st.sim = null);
  const before = { eff: game.world.canalEff, effB: game.bau.canalEff };
  applySeason(G, game.world, rp, game.calib); applySeason(G, game.bau, rb, game.calib);
  game.history.push({ s, wx, p: rp, b: rb });

}
function insights(s, wx, rp, rb, before) {

  if (wx.forecast !== wx.enso) out.push(`The ENSO outlook said ${ENSO_NAME[wx.forecast]}, but it turned out ${ENSO_NAME[wx.enso]}.`);
  rp.storms.forEach(st => { const hit = G.townName && st.towns && st.towns.length ? ` Hardest hit: ${st.towns.map(i => esc(G.townName[i])).join(', ')}.` : ''; out.push(`${stormName(st.P)} on ${dayToDate(s, st.day)}: ${st.P} mm in ${B.stormH} h (${rpText(st.P)}). Peak flow ${G.basin === 'synthetic' ? '' : 'at the river mouth '}reached ${pct(st.peakRatio)} of channel capacity. ${st.households ? `${fmtQ(st.households)} homes flooded` : 'Towns stayed dry'} (BAU: ${fmtQ(st.bauHouseholds)}).${st.households ? hit : ''} ${fmtHa(st.subHa)} of paddies went under water (BAU: ${fmtHa(st.bauSub)}).`); });
  if (rp.lostT > 5) out.push(`Storm damage cost you about ${fmtQ(rp.lostT)} t of rice. Sub1 varieties survive up to ~2 weeks under water; early-maturing ones may already be harvested when late storms arrive.`);
  if (rp.sKey === 'ds') out.push(`The canals met ${pct(rp.cov)} of irrigation demand (BAU ${pct(rb.cov)}). ${fmtHa(rp.tailShort)} at the tail end got less than 60% of the water they needed (BAU ${fmtHa(rb.tailShort)}).`);
  if (rp.flowerShortHa > 0) out.push(`${fmtHa(rp.flowerShortHa)} of rice got less than 80% of its water at flowering (BAU ${fmtHa(rb.flowerShortHa)}). Shortage at flowering causes empty grains, so it costs far more yield than shortage at any other stage.`);
  else if (rp.riceHa > 0) out.push(`All rice had enough water at flowering${rb.flowerShortHa > 0 ? ` (BAU: ${fmtHa(rb.flowerShortHa)} short)` : ''}.`);
  (G.dams || []).forEach((d, k) => out.push(`${d.name}: ${fmtM3(rp.damTrace[k][0])} at the start, ${fmtM3(rp.damEnd[k])} at the end of the season (BAU ${fmtM3(rb.damEnd[k])}).${rp.spill[k] > 0.02 * d.cap ? ` ${fmtM3(rp.spill[k])} spilled or was released for flood safety.` : ''}`));
  if (rp.pumped > 0) out.push(`Shallow tube wells pumped ${fmtM3(rp.pumped)} for ${fmtPeso(rp.pumpCost)} in diesel (${fmtQ(rp.pumpT)} t CO₂e). The water table ended at ${rp.gwEnd.toFixed(1)} m${rp.wellsFailed ? '; some wells could no longer lift water (below ~7.5 m)' : ''}.`);
  if (rp.burnt > 1) out.push(`Burning last season's straw released ${fmtQ(rp.burnt)} t CO₂e, and open burning is banned under the Clean Air Act (RA 8749).`);
  if (rp.ch4t > 0.6 * rp.co2e) out.push(`Methane from flooded fields was ${pct(rp.ch4t / Math.max(rp.co2e, 1))} of your emissions. AWD and keeping fresh straw out of flooded soil cut it most.`);

  if (CREDITS.on) out.push(rp.creditT > 0 ? `Hypothetical carbon credits: ${fmtQ(rp.creditT)} t CO₂e from ${fmtHa(rp.creditHa)} of scheduled canal command (${sched.join('; ')}), worth ${fmtPeso(rp.creditPHP)} at US$${CREDITS.usd}/t. Farmers' 70% share, ${fmtPeso(rp.creditFarm)}, is counted in farm income.` : `No carbon credits this season: only fields under a rotational or synchronized-AWD canal schedule can be monitored well enough to claim them.`);

}
function cmpRow(label, a, b, better, f) { const d = b ? a / b - 1 : 0; const good = better === 'up' ? d >= -0.0005 : d <= 0.0005; return `<tr><td>${label}</td><td>${f(a)}</td><td>${f(b)}</td><td class="${Math.abs(d) < 0.0005 ? '' : good ? 'g' : 'r'}">${Math.abs(d) < 0.0005 ? '–' : (d > 0 ? '+' : '−') + (Math.abs(d) < 0.01 ? Math.abs(d * 100).toFixed(1) : Math.abs(Math.round(d * 100))) + '%'}</td></tr>`; }

function lineChart(pv, bv, fmt) {

    <label><input type="radio" name="basin" value="pampanga" ${cur === 'pampanga' ? 'checked' : ''}><b>Pampanga River Basin</b>Central Luzon, ~10,000 km² at 2.5 km cells: UPRIIS and AMRIS, Pantabangan and Angat reservoirs, Candaba Swamp and 48 towns.</label>
  </div>
  <div class="seedrow"><span>Upper dam on the generated basin:</span>${['small', 'medium', 'large'].map(z => `<label style="display:inline-flex;gap:4px;align-items:center"><input type="radio" name="dam" value="${z}" ${z === ((game && game.damSize) || 'medium') ? 'checked' : ''}>${z[0].toUpperCase() + z.slice(1)}</label>`).join('')}<span class="meta">holds ${Object.values(BASINS.synthetic.damSizes).map(v => Math.round(v * 100) + '%').join(' / ')} of a dry season's canal water</span></div>
  <div class="seedrow"><label for="basinFile">Or load a basin file (.json)</label><input type="file" id="basinFile" accept=".json,application/json" style="width:auto"><span class="meta" id="basinFileMsg">${customBasin ? 'Loaded: ' + esc(customBasin.name) : ''}</span></div>
  <h3>Your targets over 4 years</h3>
  <ul>${TARGETS.map(T => `<li><b>${T.label}</b>: ${T.rule}</li>`).join('')}</ul>
  <h3>Levers</h3>
  <ul><li><b>Field plans</b>: variety (inbred, hybrid, Sub1, early), transplanting or direct seeding, continuous flooding or AWD, nitrogen rate or Rice Crop Manager, straw management, or mungbean in the dry season. Your extension team reaches a limited number of new parcels each season.</li>
  <li><b>Landscape</b>: reforest degraded hills, build small dams on tributaries, plant river buffers, raise paddy bunds, rehabilitate the canals.</li></ul>
  <h3>Scenario</h3>
  <div class="scen">${Object.entries(SCEN).map(([k, v]) => `<label><input type="radio" name="scen" value="${k}" ${k === (game ? game.scen : 'balanced') ? 'checked' : ''}><b>${v.name}</b>${v.blurb}</label>`).join('')}</div>
  <div class="seedrow"><label for="seedIn">Basin / weather number</label><input id="seedIn" inputmode="numeric" value="${seed}"><span class="meta">Give a class the same number so everyone plays the same landscape and weather.</span></div>
  <div class="foot"><button class="btn primary" id="mStart" type="button">Start planning ▸</button></div>`);
  $('#basinFile').addEventListener('change', async ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return; const msg = $('#basinFileMsg');
    try {
      const D = JSON.parse(await f.text());
      if (!D.W || !D.H || !D.elev || !D.lc || D.elev.length !== D.W * D.H || D.lc.length !== D.W * D.H || D.outlet == null) throw new Error('missing W, H, elev, lc or outlet');
      D.id = D.id === 'pampanga' || D.id === 'synthetic' || !D.id ? 'custom' : String(D.id).replace(/[^a-z0-9_-]/gi, '').slice(0, 30) || 'custom';
      customBasin = D; msg.textContent = 'Loaded: ' + (D.name || 'custom basin');
      const r = document.querySelector('.basinpick'); if (!r.querySelector('[value=custom]')) r.insertAdjacentHTML('beforeend', `<label><input type="radio" name="basin" value="custom" checked><b></b>Your basin file</label>`);
      r.querySelector('[value=custom]').checked = true; r.querySelector('[value=custom]').parentElement.querySelector('b').textContent = D.name || 'Custom basin';
    } catch (e) { msg.textContent = `That file is not a basin file (${e.message}).`; }
  });
  if (customBasin) { const r = document.querySelector('.basinpick'); r.insertAdjacentHTML('beforeend', `<label><input type="radio" name="basin" value="custom" ${cur === 'custom' ? 'checked' : ''}><b></b>Your basin file</label>`); r.querySelector('[value=custom]').parentElement.querySelector('b').textContent = customBasin.name || 'Custom basin'; }
  $('#mStart').addEventListener('click', () => {
    const sd = parseInt($('#seedIn').value, 10) || seed; const sc = (document.querySelector('input[name="scen"]:checked') || {}).value || 'balanced';
    const bs = (document.querySelector('input[name="basin"]:checked') || {}).value || 'synthetic';
    const dz = (document.querySelector('input[name="dam"]:checked') || {}).value || 'medium';
    closeModal(); newGame(sd, sc, bs, dz);
  });
}

// ---------- science tab ----------
function renderScience() {
  $('#tab-science').innerHTML = `<span class="eyebrow">Model notes</span><h2>How the basin works</h2>
  <p>This is a teaching emulator. It reproduces the direction and rough size of real responses so players can explore trade-offs. It is not a calibrated forecast for any place.</p>
  ${G && G.basin !== 'synthetic' ? `<h3>This basin: ${esc(G.basinName || '')}</h3>
  <p>${esc(G.note || '')} One cell is ${G.cellKm} × ${G.cellKm} km (${fmtInt(B.cellHa)} ha); a paddy cell counts as ${fmtInt(B.farmHa)} ha of rice. Storms are ${B.stormH}-hour totals (1-in-25 = ${Math.round(designP(25))} mm). Channels are sized so business-as-usual just floods in a 1-in-${B.calibT} storm. Existing reservoirs hold flood water before they spill: ${G.systems.map(s => `<b>${esc(s.name)}</b> (${esc(s.full || '')}${s.source ? ', fed by ' + esc(s.source) : ''})`).join(' and ')} share canal water head-end first. Homes counted are households in flood-prone areas of each town (illustrative, from census population).</p>
  <p>To play on a DEM-based grid, run <code>make_basin_from_dem.py</code> on a DEM and land-cover raster and load the file from the start screen.</p>` : ''}
  <h3>Rice yield</h3>
  <p>Potential yield is anchored to an ORYZA v3 run for Los Baños (2008 wet season, transplanted, potential N): <code>7.97 t/ha</code>. The dry season uses 9.6 t/ha for higher radiation. Farm yield = potential × 0.70 (pests, weeds, timing) × a nitrogen response × a water response. Variety, establishment, straw, El Niño heat at flowering and storm damage then adjust it.</p>
  <p>To use your own ORYZA runs, set <code>ORYZA_TABLE = {ws:{inbred:…,hybrid:…,sub1:…,early:…}, ds:{…}}</code> with potential yields (t/ha) per season and variety.</p>
  <h3>Greenhouse gases</h3>
  <ul><li>Methane: IPCC 2019 Refinement Tier 1. Baseline 1.22 kg CH₄/ha/day (South-East Asia) × water-regime factor (continuous 1.0, single drainage 0.71, AWD 0.55, rainfed 0.54, drought-prone 0.16) × straw factor (1 + 5 t × CF)<sup>0.59</sup> (fresh straw CF 1.0, early incorporation 0.19) × days in field. Direct seeding × 0.82 (assumption).</li>
  <li>Nitrous oxide: direct EF 0.003 (continuous flooding) or 0.005 (drained) kg N₂O-N/kg N, plus indirect volatilisation and leaching losses.</li>
  <li>Urea CO₂ and straw burning (2.7 g CH₄ and 0.07 g N₂O per kg burnt). GWP100 from AR6: CH₄ 27, N₂O 273.</li></ul>
  <h3>Growth stages, dams and groundwater</h3>
  <p>Each season runs as four months that match the crop stages of a 115-day variety: land prep, tillering, flowering, grain filling (early-maturing varieties flower about a month sooner). A water shortfall cuts yield by stage: 25%, 35%, 110% and 40% of the shortage, so a dry flowering month is the costliest. Dry-season rain falls mostly in Nov–Dec, so Feb–Mar flowering depends on stored water.</p>
  <p>The dam fills from wet-season inflow, typhoon runoff it catches, and a little dry-season inflow; ${G && G.basin !== 'synthetic' ? 'capacities are scaled to the irrigation systems’ demand and are game values, not official figures; Angat serves Metro Manila first' : 'its size is a share of one dry season’s canal water'}. Auto release spreads storage evenly over the remaining months. Groundwater: specific yield 0.1 over the paddy area; recharge 90 mm/month under flooded fields (40 under AWD), plus rain and 35% of canal losses; drainage to rivers pulls the table toward 10 m. Shallow tube wells deliver less below 5 m and nothing below 7.5 m. Diesel ₱(1 + 0.3 × depth) per m³ and 0.012 × (depth + 4) kg CO₂ per m³.</p>
  <h3>Canal schedules and carbon credits</h3>
  <p>Under continuous canal flow, AWD fields stay partly wet: methane factor 0.65 and 12% water saving (game assumptions). A rotational schedule lets AWD reach the IPCC multiple-drainage factor (0.55, 22% less water) and gives flooded fields single-drainage dry spells (0.71, 8% less water, −1% yield); it also cuts spill (+6 points conveyance efficiency, +9 for synchronized AWD). Hypothetical credits = (BAU − your field CH₄ + N₂O) on scheduled land × 0.8, sold at the chosen price; farmers receive 70%.</p>
  <h3>Water</h3>
  <p>Rice needs ~1,250 mm (wet) or ~1,500 mm (dry) per season including land preparation and seepage. AWD cuts that by 22%, direct seeding by 150 mm. Canal water is shared from the head end down; when it runs out, tail-end farms go short. Supply depends on river flow (El Niño −20% in the wet season, −40% in the dry season), canal efficiency (60%, falling as silt builds up) and stored water from impounding dams.</p>
  <h3>Floods</h3>
  <p>Typhoon rain falls over 24 h on a 1-ha grid. Hills shed water by the SCS curve number (forest 60, degraded grass 80, town 92). Paddies hold rain up to their bund height minus the water already standing (CF 5 cm, AWD 2 cm). Water then flows cell to cell through linear reservoirs to the outlet. Channels are sized so business-as-usual just floods in a 1-in-10-year storm. Low-lying paddies go under water when the nearby channel overtops; Sub1 varieties survive 10+ days, others lose most of the crop after about a week.</p>
  <h3>Storm sizes (${B.stormH}-h rain, this basin)</h3>
  <div class="tw"><table><tr><th>Return period</th><th>Rain</th></tr>${[2, 5, 10, 25, 50, 100].map(T => `<tr><td>1-in-${T} yr</td><td>${Math.round(designP(T))} mm</td></tr>`).join('')}</table></div>
  <h3>Money</h3>
  <p>Palay at ₱20/kg, mungbean ₱70/kg, nitrogen ₱70/kg N, base production cost ₱48,000/ha. Canal water is free (RA 10969). All prices are illustrative.</p>
  <h3>Simplifications</h3>
  <ul><li>Trees mature in 2 years, much faster than in reality.</li><li>Farmers adopt exactly what extension recommends.</li><li>One soil, one weather station, no pests or price shocks.</li></ul>
  <p class="meta">Inspired by Sim Reaney's <a href="https://simreaney.github.io/downstream/play/" target="_blank" rel="noopener">Downstream</a>.</p>`;
}

// ---------- class leaderboard (shared db) ----------
const LB = { db: null, user: null, uid: null, ready: false, failed: false, docs: [], unsub: null, view: 'basin', names: {} };
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };
async function initLeaderboard() {
  if (!window.claude || !window.claude.use) { LB.failed = true; renderClass(); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    LB.db = db; LB.user = user; LB.uid = user ? await user.id() : null;
    if (!db) { LB.failed = true; renderClass(); return; }
    LB.unsub = db.collection('scores').onSnapshot(snap => { LB.docs = snap.docs.filter(d => d.exists).map(d => ({ uid: d.id, data: d.data() })); LB.ready = true; renderClass(); },
      () => { LB.failed = true; renderClass(); });
  } catch (e) { LB.failed = true; renderClass(); }
}
function runKey(r) { return [r.cls, r.basin, r.seed, r.scen, r.basin === 'synthetic' ? r.dam || 'medium' : '', r.cc ? 'cc' + r.cc : 'nocc'].join('|'); }
function allRuns() { const out = []; for (const d of LB.docs) { const runs = (d.data && d.data.runs) || {}; for (const k in runs) { const r = runs[k]; if (r && typeof r === 'object') out.push({ ...r, uid: d.uid }); } } return out; }
function scoreOf(tp, tb) {
  const cap = v => clamp(v, -50, 50); let sc = 0;
  sc += cap(100 * (tp.prod / Math.max(tb.prod, 1) - 1));
  sc += cap(100 * (tp.income - tb.income) / Math.max(Math.abs(tb.income), 1));
  sc += cap(100 * (1 - tp.co2e / Math.max(tb.co2e, 1)));
  sc += tb.households > 0 ? cap(100 * (1 - tp.households / tb.households)) : (tp.households > 0 ? -20 : 0);
  sc += cap(100 * ((tp.flower ?? 0) - 0.85)) - (tp.gwEnd > 6 ? 30 : 0);
  sc += cap(100 * (1 - tp.nRiver / Math.max(tb.nRiver, 1e-9)));
  return Math.round(sc);
}
function setupSubmit(box) {
  if (box) box.innerHTML = ''; return;  // static site: class leaderboard runs only in the Claude version
  if (!box || !game || !game.final) return;
  const cls = lsGet('ob.class'), team = lsGet('ob.team');
  if (LB.failed || !LB.db) { box.innerHTML = `<div class="submitbox"><h3>Class leaderboard</h3><p class="meta">The class leaderboard works when this page is opened in Claude while signed in, with at least Contributor access.</p></div>`; return; }
  box.innerHTML = `<div class="submitbox"><h3>Submit to the class leaderboard</h3>
  <div class="form"><label for="lbClass">Class code<input id="lbClass" maxlength="40" value="${esc(cls)}" placeholder="e.g. IRRI-RICE-OCT26"></label>
  <label for="lbTeam">Team name<input id="lbTeam" maxlength="40" value="${esc(team)}" placeholder="e.g. Team Habagat"></label></div>
  <div class="row"><button class="btn primary" id="lbSubmit" type="button">Submit score</button><span class="meta" id="lbMsg"></span></div></div>`;
  $('#lbSubmit').addEventListener('click', () => submitScore($('#lbClass').value, $('#lbTeam').value));
}
async function submitScore(clsIn, teamIn) {
  const msg = $('#lbMsg'), cls = String(clsIn || '').trim().slice(0, 40), team = String(teamIn || '').trim().slice(0, 40);
  if (!cls) { msg.textContent = 'Enter the class code your facilitator gave you.'; return; }
  if (!LB.uid) { msg.textContent = 'Sign in to Claude to submit a score.'; return; }
  lsSet('ob.class', cls); lsSet('ob.team', team);
  const { stars, tp, tb } = game.final;
  const r = { cls, team, basin: game.basin, basinName: G.basinName || 'Generated basin', seed: game.seed, scen: game.scen, stars, score: stars * 1000 + scoreOf(tp, tb),
    prod: tp.prod / Math.max(tb.prod, 1), income: (tp.income - tb.income), co2e: tp.co2e / Math.max(tb.co2e, 1), homes: tp.households, homesB: tb.households,
    flower: tp.flower ?? 0, gw: tp.gwEnd, dam: game.damSize, n: tp.nRiver / Math.max(tb.nRiver, 1e-9), cc: CREDITS.on ? CREDITS.usd : 0, at: new Date().toISOString() };
  const mine = LB.docs.find(d => d.uid === LB.uid); const runs = { ...((mine && mine.data && mine.data.runs) || {}) };
  const k = runKey(r).replace(/[^A-Za-z0-9|_-]/g, '_');
  if (runs[k] && runs[k].score > r.score) { msg.textContent = `Your best for this basin (${runs[k].score}) stays on the board; this run scored ${r.score}.`; return; }
  runs[k] = r;
  const keys = Object.keys(runs); if (keys.length > 150) keys.sort((a, b) => String(runs[a].at).localeCompare(String(runs[b].at))).slice(0, keys.length - 150).forEach(x => delete runs[x]);
  $('#lbSubmit').disabled = true; msg.textContent = 'Submitting…';
  try { await LB.db.doc('scores/' + LB.uid).set({ runs }); msg.textContent = `Submitted: ${r.score} points. See the Class tab.`; lbFilter.cls = cls; renderClass(); }
  catch (e) { $('#lbSubmit').disabled = false; msg.textContent = e && e.code === 'invalid_argument' ? 'You need Contributor access to this page to submit. Ask the facilitator to share it with you as a Contributor.' : 'Could not submit right now. Try again in a moment.'; }
}
const lbFilter = { cls: lsGet('ob.class'), scope: 'basin' };
async function renderClass() {
  const el = $('#tab-class'); if (!el || el.hidden) return;
  if (LB.failed) { el.innerHTML = `<span class="eyebrow">Class leaderboard</span><h2>Leaderboard</h2><div class="empty">The shared leaderboard works when this page is opened in Claude while signed in. You can still play; scores just won't be shared.</div>`; return; }
  if (!LB.ready) { el.innerHTML = `<span class="eyebrow">Class leaderboard</span><h2>Leaderboard</h2><p class="meta">Loading class scores…</p>`; return; }
  const runs = allRuns().filter(r => !lbFilter.cls || r.cls === lbFilter.cls).filter(r => lbFilter.scope === 'all' || (game && r.basin === game.basin && r.seed === game.seed && r.scen === game.scen && (r.basin !== 'synthetic' || (r.dam || 'medium') === game.damSize)));
  runs.sort((a, b) => b.score - a.score);
  const classes = [...new Set(allRuns().map(r => r.cls))].sort();
  const ids = [...new Set(runs.map(r => r.uid))]; let ps = {};
  if (LB.user && ids.length) { try { ps = await LB.user.profiles(ids); } catch (e) { ps = {}; } }
  const pctd = v => `${v >= 1 ? '+' : '−'}${Math.abs(Math.round((v - 1) * 100))}%`;
  el.innerHTML = `<span class="eyebrow">${lbFilter.scope === 'all' ? 'All basins' : 'This basin & weather'}${lbFilter.cls ? ' · class ' + esc(lbFilter.cls) : ''}</span><h2>Leaderboard</h2>
  <div class="form"><label for="lbFilterCls">Class code<input id="lbFilterCls" list="lbClasses" maxlength="40" value="${esc(lbFilter.cls)}" placeholder="All classes"></label>
  <label for="lbScope">Show<select id="lbScope" style="font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--fg)"><option value="basin" ${lbFilter.scope === 'basin' ? 'selected' : ''}>This basin & weather</option><option value="all" ${lbFilter.scope === 'all' ? 'selected' : ''}>All runs</option></select></label></div>
  <datalist id="lbClasses">${classes.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
  <p class="hint">Finish all 8 seasons, then submit from the final report. Score = 1,000 per target met plus how far past BAU you went on each indicator.</p>
  ${runs.length ? `<div class="tw"><table class="lb"><thead><tr><th>#</th><th>Team</th><th>★</th><th>Score</th><th>Rice</th><th>GHG</th><th>Homes</th></tr></thead><tbody>
  ${runs.slice(0, 60).map((r, k) => `<tr class="${r.uid === LB.uid ? 'me' : ''}"><td>${k + 1}</td><td class="who" data-uid="${esc(r.uid)}" data-team="${esc(r.team || '')}"></td><td class="stars-s">${'★'.repeat(r.stars || 0)}</td><td>${fmtInt(r.score)}</td>
  <td class="${r.prod >= 1 ? 'g' : 'r'}">${pctd(r.prod)}</td><td class="${r.co2e <= 0.6 ? 'g' : 'r'}">${pctd(r.co2e)}</td><td>${fmtQ(r.homes)}</td></tr>`).join('')}
  </tbody></table></div>` : `<div class="empty">No scores yet${lbFilter.cls ? ' for this class' : ''}${lbFilter.scope === 'basin' ? ' on this basin and weather' : ''}. Finish a game and submit from the final report.</div>`}`;
  el.querySelectorAll('td.who').forEach(td => {
    const r = runs.find(x => x.uid === td.dataset.uid && (x.team || '') === td.dataset.team) || {}; const p = ps[td.dataset.uid] || {};
    const main = document.createElement('span'); main.textContent = td.dataset.team || p.name || 'Player';
    const sub = document.createElement('small'); sub.textContent = [td.dataset.team && p.name ? p.name : '', lbFilter.scope === 'all' ? `${r.basinName || ''} #${r.seed} · ${SCEN[r.scen] ? SCEN[r.scen].name : ''}` : '', r.cc ? `credits on, $${r.cc}/t` : ''].filter(Boolean).join(' · ');
    td.append(main, sub);
  });
  const fc = $('#lbFilterCls'); fc.addEventListener('change', () => { lbFilter.cls = fc.value.trim(); renderClass(); });
  $('#lbScope').addEventListener('change', ev => { lbFilter.scope = ev.target.value; renderClass(); });
}

// ---------- boot ----------
$('#btnRun').addEventListener('click', runCurrentSeason);
$('#btnTest').addEventListener('click', async () => {
  if (game.busy) return; game.busy = true; renderHeader();
  const sim = simStorm(G, game.world, 'ws', designP(25), game.calib, true, (G.dams || []).map((d, k) => sKeyNow() === 'ws' && game.proj.damTrace[k] ? game.proj.damTrace[k][3] : Math.min(d.cap, game.world.cushion[k] * d.cap)));
  await animateStorm(sim, `<b>Test: 1-in-25 typhoon</b><br>${Math.round(sim.P)} mm in ${B.stormH} h · peak ${pct(sim.ratio)} of channel capacity · ${sim.households ? `${fmtQ(sim.households)} homes flooded` : 'towns stay dry'} · ${fmtHa(sim.subHa)} of paddies under water`);
  setTimeout(() => { $('#mapcap').hidden = true; game.busy = false; renderHeader(); drawMap(); }, 1600);
});
$('#modal').addEventListener('keydown', ev => { if (ev.key === 'Escape' && game && $('#mStart') == null && $('#mNext') == null) closeModal(); });
let rzT = null; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { sizeCanvas(); if (game) drawMap(); }, 120); });
function applySiteTheme() { const t = lsGet('jbp.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); }
window.addEventListener('storage', ev => { if (ev.key === 'jbp.theme') { applySiteTheme(); if (game) drawMap(); } });
function boot() {
  applySiteTheme();
  CREDITS.on = lsGet('ob.cc') === '1'; CREDITS.usd = [5, 15, 30].includes(+lsGet('ob.ccusd')) ? +lsGet('ob.ccusd') : 15;
  sizeCanvas();
  newGame(1427, 'balanced');
  showIntro();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (game) drawMap(); });
boot();
